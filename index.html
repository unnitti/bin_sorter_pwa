<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PB 코드 정렬</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="app-icon" aria-hidden="true">⇧</div>
      <div class="title-wrap">
        <h1>PB 코드 정렬</h1>
        <p>클립보드의 코드를 정렬하고 변환합니다.</p>
      </div>
      <div id="stateIcon" class="state-icon" aria-hidden="true">✓</div>
    </header>

    <div id="statusCard" class="status-card" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span id="status">클립보드에서 가져오는 중…</span>
    </div>

    <section class="result-card">
      <div class="card-heading">
        <strong>변환 결과</strong>
        <span id="count">—</span>
      </div>
      <ol id="resultList" class="result-list" aria-label="변환 결과"></ol>
      <div id="emptyState" class="empty-state">클립보드에 정렬할 코드가 없습니다.</div>
    </section>

    <button id="retry" class="primary-button" type="button">↻&nbsp; 다시 가져오기</button>

    <details class="help">
      <summary>정렬 기준</summary>
      <p><b>11</b>은 고정하고, 영문 2자리를 알파벳 순으로 정렬합니다. 영문이 같으면 뒤 7자리 숫자를 오름차순으로 정렬합니다.</p>
      <p class="example"><code>11pb0131001</code> → <code>pb1-31-001</code></p>
    </details>
  </main>
  <script src="app.js"></script>
</body>
</html>
